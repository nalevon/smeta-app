<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Электромонтаж: Смета & Прайс</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 16px; position: sticky; top: 0; z-index: 100; }
    header h1 { font-size: 1.15rem; font-weight: 700; }
    header .status { font-size: 0.8rem; color: var(--text-muted); }
    .nav-tabs { display: flex; background: var(--card-bg); border-bottom: 1px solid var(--border); }
    .tab-btn { flex: 1; padding: 14px; background: none; border: none; color: var(--text-muted); font-size: 0.95rem; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .container { max-width: 600px; margin: 0 auto; padding: 16px; }
    .voice-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px; }
    .mic-btn { width: 76px; height: 76px; border-radius: 50%; border: none; background: var(--accent); color: #0f172a; display: inline-flex; justify-content: center; align-items: center; cursor: pointer; }
    .mic-btn.recording { background: var(--danger); color: #fff; animation: pulse 1.4s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
    .voice-status { margin-top: 12px; font-size: 0.9rem; color: var(--text-muted); }
    .manual-input { width: 100%; background: #0f172a; border: 1px solid var(--border); border-radius: 10px; color: #fff; padding: 12px; margin-top: 14px; min-height: 70px; font-size: 0.95rem; }
    .btn-parse { width: 100%; background: var(--accent); color: #0f172a; font-weight: 700; border: none; padding: 12px; border-radius: 10px; margin-top: 10px; cursor: pointer; }
    .estimate-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 20px; margin-top: 15px; }
    .estimate-header { padding: 14px 16px; background: #182234; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; font-weight: 600; }
    .estimate-item { padding: 12px 16px; border-bottom: 1px solid rgba(51, 65, 85, 0.4); display: flex; justify-content: space-between; align-items: center; }
    .estimate-item:last-child { border-bottom: none; }
    .item-name { font-size: 0.95rem; font-weight: 500; }
    .item-details { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    .item-sum { font-size: 1rem; font-weight: 700; color: var(--accent); }
    .total-box { padding: 16px; background: #182234; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); }
    .total-title { font-size: 1.1rem; font-weight: 600; }
    .total-amount { font-size: 1.4rem; font-weight: 800; color: var(--success); }
    .action-btn { width: 100%; background: #334155; color: #fff; font-weight: 600; border: none; padding: 13px; border-radius: 10px; margin-top: 10px; cursor: pointer; }
    .price-row { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .price-name { font-size: 0.95rem; font-weight: 500; flex: 1; }
    .price-unit { font-size: 0.75rem; color: var(--text-muted); }
    .price-input-wrapper { display: flex; align-items: center; gap: 6px; }
    .price-input { width: 90px; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; color: #fff; padding: 6px 8px; font-size: 0.95rem; font-weight: 700; text-align: right; }
    .del-btn { background: none; border: none; color: var(--danger); font-size: 1.2rem; cursor: pointer; padding: 4px 8px; }
    .add-service-form { background: var(--card-bg); border: 1px dashed var(--accent); border-radius: 12px; padding: 16px; margin-top: 20px; }
    .add-service-form input { width: 100%; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; color: #fff; padding: 10px; margin-bottom: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>⚡ Электромонтаж</h1>
    <div class="status">Калькулятор и голосовая смета</div>
  </header>
  
  <div class="nav-tabs">
    <button id="tabBtnEstimate" class="tab-btn active" onclick="switchTab('estimate')">Смета</button>
    <button id="tabBtnPrices" class="tab-btn" onclick="switchTab('prices')">Прайс-лист</button>
  </div>

  <div class="container">
    <!-- Вкладка 1: Смета -->
    <div id="tab-estimate">
      <div class="voice-panel">
        <button id="micBtn" class="mic-btn" type="button" onclick="toggleVoice()">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <div id="voiceStatus" class="voice-status">Нажмите для голосового ввода</div>
        <textarea id="manualText" class="manual-input" placeholder="Или напишите текстом: 100м кабеля в гофре, 3 розетки, 5 светильников, датчик движения..."></textarea>
        <button class="btn-parse" type="button" onclick="processText()">Рассчитать смету</button>
      </div>

      <div id="estimateCard" class="estimate-card hidden">
        <div class="estimate-header">
          <span>Сформированная смета</span>
          <span id="itemsCount" style="color: var(--text-muted); font-size: 0.85rem;"></span>
        </div>
        <div id="estimateList"></div>
        <div class="total-box">
          <div class="total-title">ИТОГО:</div>
          <div id="totalSum" class="total-amount">0 ₽</div>
        </div>
      </div>

      <button id="copyBtn" class="action-btn hidden" type="button" onclick="copyEstimate()">📋 Скопировать смету текстом</button>
    </div>

    <!-- Вкладка 2: Прайс -->
    <div id="tab-prices" class="hidden">
      <div id="priceListContainer"></div>

      <div class="add-service-form">
        <h3 style="font-size: 1rem; margin-bottom: 12px; color: var(--accent);">+ Добавить новую услугу</h3>
        <input type="text" id="newName" placeholder="Название (например: Монтаж щитка 24м)">
        <input type="text" id="newUnit" placeholder="Ед. изм. (шт., пог. м)">
        <input type="number" id="newPrice" placeholder="Цена, ₽">
        <button class="btn-parse" type="button" onclick="addNewPrice()">Добавить в прайс</button>
      </div>

      <button class="action-btn" style="margin-top: 15px; color: var(--text-muted);" type="button" onclick="resetPricesToDefault()">🔄 Сбросить прайс к начальному</button>
    </div>
  </div>

  <script>
    var DEFAULT_PRICES = [
      { id: 1, name: "Штробление стены (бетон)", unit: "пог. м", price: 700 },
      { id: 2, name: "Штробление стены (кирпич)", unit: "пог. м", price: 500 },
      { id: 3, name: "Отверстия под подрозетники (бетон)", unit: "шт.", price: 1000 },
      { id: 4, name: "Отверстия под подрозетники (кирпич)", unit: "шт.", price: 500 },
      { id: 5, name: "Установка и вмазка подрозетника", unit: "шт.", price: 150 },
      { id: 6, name: "Замазка штроб", unit: "пог. м", price: 150 },
      { id: 7, name: "Установка розеток", unit: "шт.", price: 300 },
      { id: 8, name: "Установка выключателей", unit: "шт.", price: 300 },
      { id: 9, name: "Установка люстры", unit: "шт.", price: 1000 },
      { id: 10, name: "Установка светильника", unit: "шт.", price: 300 },
      { id: 11, name: "Прокладка кабеля без гофры", unit: "пог. м", price: 120 },
      { id: 12, name: "Прокладка кабеля в гофре", unit: "пог. м", price: 150 },
      { id: 13, name: "Расключение распредкоробок", unit: "шт.", price: 800 },
      { id: 14, name: "Проходное отверстие", unit: "шт.", price: 400 },
      { id: 15, name: "Демонтаж точек", unit: "шт.", price: 50 },
      { id: 16, name: "Расключение щита до 12 модулей", unit: "шт.", price: 15000 },
      { id: 17, name: "Наращивание кабеля гильзами ГМЛ", unit: "шт.", price: 800 },
      { id: 18, name: "Установка датчика движения", unit: "шт.", price: 1000 },
      { id: 19, name: "Установка КЛК-5", unit: "шт.", price: 1000 },
      { id: 20, name: "Подключение духового шкафа", unit: "шт.", price: 500 },
      { id: 21, name: "Подключение варочной панели", unit: "шт.", price: 500 }
    ];

    var currentPrices = [];
    var currentEstimate = [];

    function loadPrices() {
      var saved = localStorage.getItem('electro_prices_v1');
      if (saved) {
        try { currentPrices = JSON.parse(saved); } catch(e) { currentPrices = DEFAULT_PRICES.slice(); }
      } else {
        currentPrices = DEFAULT_PRICES.slice();
      }
      renderPriceEditor();
    }

    function savePrices() {
      localStorage.setItem('electro_prices_v1', JSON.stringify(currentPrices));
      renderPriceEditor();
    }

    function resetPricesToDefault() {
      if (confirm("Вернуть исходные расценки прайса?")) {
        currentPrices = JSON.parse(JSON.stringify(DEFAULT_PRICES));
        savePrices();
      }
    }

    function renderPriceEditor() {
      var container = document.getElementById('priceListContainer');
      container.innerHTML = '';
      currentPrices.forEach(function(item, index) {
        var div = document.createElement('div');
        div.className = 'price-row';
        div.innerHTML = 
          '<div class="price-name">' + item.name + '<div class="price-unit">' + item.unit + '</div></div>' +
          '<div class="price-input-wrapper">' +
            '<input type="number" class="price-input" value="' + item.price + '" onchange="updatePriceValue(' + index + ', this.value)">' +
            '<span>₽</span>' +
            '<button class="del-btn" type="button" onclick="deletePriceItem(' + index + ')">✕</button>' +
          '</div>';
        container.appendChild(div);
      });
    }

    function updatePriceValue(index, val) {
      var parsed = parseInt(val, 10);
      if (!isNaN(parsed)) {
        currentPrices[index].price = parsed;
        savePrices();
      }
    }

    function deletePriceItem(index) {
      if (confirm('Удалить "' + currentPrices[index].name + '"?')) {
        currentPrices.splice(index, 1);
        savePrices();
      }
    }

    function addNewPrice() {
      var name = document.getElementById('newName').value.trim();
      var unit = document.getElementById('newUnit').value.trim() || 'шт.';
      var price = parseInt(document.getElementById('newPrice').value, 10);
      if (!name || isNaN(price)) return alert("Укажите название и цену.");
      currentPrices.push({ id: Date.now(), name: name, unit: unit, price: price });
      document.getElementById('newName').value = '';
      document.getElementById('newPrice').value = '';
      savePrices();
    }

    function switchTab(tab) {
      var tabEstimate = document.getElementById('tab-estimate');
      var tabPrices = document.getElementById('tab-prices');
      var btnEstimate = document.getElementById('tabBtnEstimate');
      var btnPrices = document.getElementById('tabBtnPrices');

      if (tab === 'estimate') {
        btnEstimate.className = 'tab-btn active';
        btnPrices.className = 'tab-btn';
        tabEstimate.className = '';
        tabPrices.className = 'hidden';
      } else {
        btnPrices.className = 'tab-btn active';
        btnEstimate.className = 'tab-btn';
        tabPrices.className = '';
        tabEstimate.className = 'hidden';
      }
    }

    var recognition = null;
    var isRecording = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRec();
      recognition.lang = 'ru-RU';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = function() {
        isRecording = true;
        document.getElementById('micBtn').className = 'mic-btn recording';
        document.getElementById('voiceStatus').innerText = "Слушаю... Говорите";
      };
      recognition.onresult = function(e) {
        var text = e.results[0][0].transcript;
        var input = document.getElementById('manualText');
        input.value = (input.value ? input.value + " " : "") + text;
        processText();
      };
      recognition.onerror = function() { stopVoice(); };
      recognition.onend = function() { stopVoice(); };
    }

    function toggleVoice() {
      if (!recognition) return alert("Голосовой ввод не поддерживается данным браузером. Введите текст в поле вручную.");
      if (isRecording) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function stopVoice() {
      isRecording = false;
      document.getElementById('micBtn').className = 'mic-btn';
      document.getElementById('voiceStatus').innerText = "Нажмите для голосового ввода";
    }

    var NUM_WORDS = { 'один': 1, 'одна': 1, 'одну': 1, 'два': 2, 'две': 2, 'три': 3, 'четыре': 4, 'пять': 5, 'шесть': 6, 'семь': 7, 'восемь': 8, 'девять': 9, 'десять': 10, 'двадцать': 20, 'тридцать': 30, 'сорок': 40, 'пятьдесят': 50, 'сто': 100, 'двести': 200 };

    function parseSpokenInput(rawText) {
      var text = rawText.toLowerCase();
      text = text.replace(/\b(\w+)\s+(стоп|нет|отмена|ой)\s+(\w+)\b/g, '$3');

      for (var w in NUM_WORDS) {
        text = text.replace(new RegExp('\\b' + w + '\\b', 'g'), NUM_WORDS[w]);
      }

      var parts = text.split(/[,;\n+]+|\s+(?:и|плюс|также)\s+/);
      var results = [];

      parts.forEach(function(part) {
        var trimmed = part.trim();
        if (!trimmed) return;
        var matchNum = trimmed.match(/\b(\d+)\b/);
        var qty = matchNum ? parseInt(matchNum[1], 10) : 1;
        var s = null;

        if (trimmed.indexOf('гофр') !== -1) s = currentPrices.find(function(p) { return p.id === 12; });
        else if (trimmed.indexOf('кабел') !== -1 || trimmed.indexOf('провод') !== -1) s = currentPrices.find(function(p) { return p.id === 11; });
        else if (trimmed.indexOf('датчик') !== -1) s = currentPrices.find(function(p) { return p.id === 18; });
        else if (trimmed.indexOf('выключател') !== -1) s = currentPrices.find(function(p) { return p.id === 8; });
        else if (trimmed.indexOf('розет') !== -1) s = currentPrices.find(function(p) { return p.id === 7; });
        else if (trimmed.indexOf('светильник') !== -1 || trimmed.indexOf('спот') !== -1) s = currentPrices.find(function(p) { return p.id === 10; });
        else if (trimmed.indexOf('люстр') !== -1) s = currentPrices.find(function(p) { return p.id === 9; });
        else if (trimmed.indexOf('клк') !== -1) s = currentPrices.find(function(p) { return p.id === 19; });
        else if (trimmed.indexOf('духов') !== -1) s = currentPrices.find(function(p) { return p.id === 20; });
        else if (trimmed.indexOf('варочн') !== -1) s = currentPrices.find(function(p) { return p.id === 21; });
        else if (trimmed.indexOf('щит') !== -1) s = currentPrices.find(function(p) { return p.id === 16; });
        else if (trimmed.indexOf('штроб') !== -1 && trimmed.indexOf('бетон') !== -1) s = currentPrices.find(function(p) { return p.id === 1; });
        else if (trimmed.indexOf('штроб') !== -1) s = currentPrices.find(function(p) { return p.id === 2; });
        else if (trimmed.indexOf('короб') !== -1) s = currentPrices.find(function(p) { return p.id === 13; });
        else {
          s = currentPrices.find(function(p) {
            return trimmed.split(' ').some(function(w) { return w.length > 3 && p.name.toLowerCase().indexOf(w) !== -1; });
          });
        }

        if (s) {
          var exist = results.find(function(r) { return r.service.id === s.id; });
          if (exist) { exist.qty += qty; } else { results.push({ service: s, qty: qty }); }
        }
      });

      return results;
    }

    function processText() {
      var input = document.getElementById('manualText').value;
      if (!input.trim()) return;
      currentEstimate = parseSpokenInput(input);
      renderEstimate(currentEstimate);
    }

    function renderEstimate(items) {
      var card = document.getElementById('estimateCard');
      var list = document.getElementById('estimateList');
      var copyBtn = document.getElementById('copyBtn');
      var totalSumEl = document.getElementById('totalSum');

      if (!items || items.length === 0) {
        card.className = 'estimate-card hidden';
        copyBtn.className = 'action-btn hidden';
        return;
      }

      list.innerHTML = '';
      var total = 0;

      items.forEach(function(item) {
        var sum = item.qty * item.service.price;
        total += sum;
        var row = document.createElement('div');
        row.className = 'estimate-item';
        row.innerHTML = 
          '<div>' +
            '<div class="item-name">' + item.service.name + '</div>' +
            '<div class="item-details">' + item.qty + ' ' + item.service.unit + ' × ' + item.service.price.toLocaleString('ru-RU') + ' ₽</div>' +
          '</div>' +
          '<div class="item-sum">' + sum.toLocaleString('ru-RU') + ' ₽</div>';
        list.appendChild(row);
      });

      totalSumEl.innerText = total.toLocaleString('ru-RU') + " ₽";
      document.getElementById('itemsCount').innerText = items.length + " поз.";
      card.className = 'estimate-card';
      copyBtn.className = 'action-btn';
    }

    function copyEstimate() {
      if (currentEstimate.length === 0) return;
      var total = 0;
      var text = "⚡ Смета на электромонтажные работы:\n\n";

      currentEstimate.forEach(function(item, i) {
        var sum = item.qty * item.service.price;
        total += sum;
        text += (i + 1) + ". " + item.service.name + ": " + item.qty + " " + item.service.unit + " × " + item.service.price + " ₽ = " + sum + " ₽\n";
      });

      text += "\nИТОГО К ОПЛАТЕ: " + total.toLocaleString('ru-RU') + " ₽";
      navigator.clipboard.writeText(text).then(function() {
        alert("Смета скопирована в буфер!");
      });
    }

    loadPrices();
  </script>
</body>
</html>
